<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Preview Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
  <div class="card-image">
  <img src="image-product-desktop.svg" alt="Gabriella de Perfume">
  </div>
  <div class="card-content">
    <p class="category">PERFUME</p>
    <h1 class="title">Gabriella Essence Eau de Parfum</h1>
    <p class="description">
      A floral, solar and voluptuous interpretation composed by Oliver Polge, Perfumer-Creator for the House of CHANEL
    </p>

    <div class="price-box">
      <span class="price-current"> $149.99</span>
      <span class="price-old">$169.99</span>
    </div>

    <button class="btn-cart">
      <img src="Cart.svg" alt="Cart Icon">
      Add to Cart
      </button>
    </div>
  </main>

</body>
</html>
