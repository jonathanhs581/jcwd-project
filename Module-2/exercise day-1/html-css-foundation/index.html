<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Preview Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="card">
    <div class="card-image">
      <img src="Blog Image.svg" alt="Ilustration Article">
    </div>

    <div>
      <span class="tag">Learning</span>
      <p class="publish-date">Published 21 Dec 2023</p>
      <h1 class="title"><a href="#">HTML & CSS foundation</a></h1>
      <p class="description">
        These languages are the bacbone of every website, defining structure, content, and presentation.
      </p>
    </div>

    <div class="card-author">
      <img src="userpic.svg" alt="Greg Hooper" class="avatar">
      <span class="greg-hooper">Greg Hooper</span>

    </div>
  </main>
  
</body>
</html>
